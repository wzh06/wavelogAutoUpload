<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑配置</title><style>body{font-family:Segoe UI,Arial;background:#f5f7fb;color:#202938}.wrap{max-width:640px;margin:30px auto}.card{background:white;padding:22px;border-radius:8px;box-shadow:0 1px 4px #ccd3df}label{display:block;margin:12px 0;font-size:13px;color:#475569}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd3df;border-radius:6px;background:white}button{padding:9px 14px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer}button.secondary{background:#526172}button:disabled{opacity:.6;cursor:wait}.station-tools{display:flex;gap:8px;align-items:end}.station-tools label{flex:1}.station-status{display:block;margin-top:5px;font-size:12px}.bad{color:#b91c1c}.ok{color:#15803d}.muted{color:#64748b}a{margin-left:12px}@media(max-width:600px){.station-tools{display:block}.station-tools button{margin-top:8px}}</style></head><body><div class="wrap"><div class="card"><h1>编辑 {{user.name}}</h1><form method="post"><label>名称<input name="name" value="{{user.name}}" required></label><label>ADI目录<input name="directory" value="{{user.directory}}" required></label><label>服务器URL<input id="edit-server-url" name="server_url" value="{{user.server_url}}" required></label><label>新 API Key（留空不修改）<input id="edit-api-key" name="api_key" type="password"></label><div class="station-tools"><label>上传台站<select id="edit-station-profile" name="station_profile_id"><option value="">自动选择启用的台站</option>{% if user.station_profile_id %}<option value="{{user.station_profile_id}}" selected>当前台站（ID: {{user.station_profile_id}}）</option>{% endif %}</select><span id="edit-station-status" class="station-status muted">填写新 API Key 时使用新 key，否则使用已保存的旧 key</span></label><button id="edit-query-stations" type="button" class="secondary">查询台站</button></div><label>扫描间隔（秒）<input name="scan_interval" type="number" min="5" value="{{user.scan_interval}}"></label><button>保存</button><a href="/">取消</a></form></div></div><script>
(function () {
  const server = document.getElementById('edit-server-url');
  const key = document.getElementById('edit-api-key');
  const select = document.getElementById('edit-station-profile');
  const button = document.getElementById('edit-query-stations');
  const status = document.getElementById('edit-station-status');
  button.addEventListener('click', async function () {
    if (!server.value.trim()) {
      status.textContent = '请填写服务器 URL';
      status.className = 'station-status bad';
      return;
    }
    button.disabled = true;
    status.textContent = '正在查询台站…';
    status.className = 'station-status muted';
    try {
      const body = new URLSearchParams({server_url: server.value.trim(), api_key: key.value.trim(), user_id: '{{user.id}}'});
      const response = await fetch('/api/stations', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body});
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || '查询台站失败');
      const current = select.value;
      select.innerHTML = '<option value="">自动选择启用的台站</option>';
      (data.stations || []).forEach(function (station) {
        const id = String(station.station_id);
        const name = station.station_profile_name || station.station_name || station.station_callsign || ('台站 ' + id);
        const grid = station.station_gridsquare || station.station_grid || station.grid || station.station_locator || station.locator || station.grid_square || '未设置';
        const option = document.createElement('option');
        option.value = id;
        option.textContent = name + '（网格: ' + grid + '，ID: ' + id + (String(station.station_active) === '1' ? '，启用' : '') + '）';
        if (id === current) option.selected = true;
        select.appendChild(option);
      });
      status.textContent = '已找到 ' + (data.stations || []).length + ' 个台站';
      status.className = 'station-status ok';
    } catch (error) {
      status.textContent = error.message || '查询台站失败';
      status.className = 'station-status bad';
    } finally {
      button.disabled = false;
    }
  });
})();
</script></body></html>
