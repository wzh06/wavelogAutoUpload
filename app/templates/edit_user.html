<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑配置</title><style>body{font-family:Segoe UI,Arial;background:#f5f7fb;color:#202938}.wrap{max-width:640px;margin:30px auto}.card{background:white;padding:22px;border-radius:8px;box-shadow:0 1px 4px #ccd3df}label{display:block;margin:12px 0}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd3df;border-radius:6px}button{padding:9px 14px;background:#2563eb;color:white;border:0;border-radius:6px}a{margin-left:12px}</style></head><body><div class="wrap"><div class="card"><h1>编辑 {{user.name}}</h1><form method="post"><label>名称<input name="name" value="{{user.name}}" required></label><label>ADI目录<input name="directory" value="{{user.directory}}" required></label><label>服务器URL<input name="server_url" value="{{user.server_url}}" required></label><label>新 API Key（留空不修改）<input name="api_key" type="password"></label><label>电台位置ID（可选）<input name="station_profile_id" value="{{user.station_profile_id}}"></label><label>扫描间隔（秒）<input name="scan_interval" type="number" min="5" value="{{user.scan_interval}}"></label><button>保存</button><a href="/">取消</a></form></div></div></body></html>
